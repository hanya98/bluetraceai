version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluetrace-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=BlueTrace AI Backend
      - APP_VERSION=1.0.0
      - LOG_LEVEL=INFO
      - MODEL3_MODE=heuristic
      - DATABASE_URL=postgresql+asyncpg://bluetrace:bluetrace@db:5432/bluetrace
    volumes:
      - ./weights:/app/weights
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgis/postgis:15-3.3
    container_name: bluetrace-db
    environment:
      - POSTGRES_USER=bluetrace
      - POSTGRES_PASSWORD=bluetrace
      - POSTGRES_DB=bluetrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
